<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Agente de IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #1e1e2e; color: #cdd6f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 500px; height: 80vh; background: #181825; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .header { background: #11111b; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #313244; color: #cba6f7; }
    .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
    .user { background: #89b4fa; color: #11111b; align-self: flex-end; }
    .bot { background: #313244; color: #cdd6f4; align-self: flex-start; }
    .input-area { display: flex; padding: 10px; background: #11111b; border-top: 1px solid #313244; }
    input { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #313244; color: #fff; outline: none; }
    button { margin-left: 8px; padding: 12px 18px; border: none; border-radius: 6px; background: #cba6f7; color: #11111b; font-weight: bold; cursor: pointer; }
    button:hover { background: #b4befe; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">🤖 Meu Agente de IA</div>
  <div class="messages" id="chat">
    <div class="message bot">Olá! Como posso ajudar você hoje?</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Digite sua mensagem...">
    <button onclick="enviarMensagem()">Enviar</button>
  </div>
</div>

<script>
  const API_KEY = "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";

  async function enviarMensagem() {
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const texto = input.value.trim();

    if (!texto) return;

    chat.innerHTML += `<div class="message user">${texto}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    const botMsg = document.createElement("div");
    botMsg.className = "message bot";
    botMsg.innerText = "Pensando...";
    chat.appendChild(botMsg);
    chat.scrollTop = chat.scrollHeight;

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: "Você é um assistente virtual prestativo e simpático." },
            { role: "user", content: texto }
          ]
        })
      });

      const data = await response.json();
      botMsg.innerText = data.choices[0].message.content;

    } catch (error) {
      botMsg.innerText = "Erro ao conectar com a IA. Verifique sua chave de API.";
    }
    chat.scrollTop = chat.scrollHeight;
  }

  document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") enviarMensagem();
  });
</script>

</body>
</html>
